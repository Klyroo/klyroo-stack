name: Docs

# Publishes https://klyroo.github.io/klyroo-stack/: the Klyroo showcase (the home page), the docs of Klyroo.Stack from
# README.md and docs/ (settings in docs/site.yml), and the playgrounds of every library below /playground/.
# The build is docs-site/ and playground/ of this repository: see their READMEs.

on:
  push:
    branches: [main]
    paths:
      - docs/**
      - README.md
      - docs-site/**
      - playground/**
      - build/publish-playground.sh
      - .github/workflows/docs-pages.yml
      - .github/workflows/docs.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: docs-pages
  cancel-in-progress: true

jobs:
  docs:
    uses: ./.github/workflows/docs-pages.yml
    with:
      repo: klyroo-stack
      playground: true
