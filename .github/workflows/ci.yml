name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: klyroo-stack
    steps:
      - uses: actions/checkout@v4
        with:
          path: klyroo-stack
      - name: Check out klyroo-agent (referenced by relative path)
        uses: actions/checkout@v4
        with:
          repository: klyroo/klyroo-agent
          path: klyroo-agent
      - name: Check out klyroo-dashboard (referenced by relative path)
        uses: actions/checkout@v4
        with:
          repository: klyroo/klyroo-dashboard
          path: klyroo-dashboard
      - name: Check out klyroo-display (referenced by relative path)
        uses: actions/checkout@v4
        with:
          repository: klyroo/klyroo-display
          path: klyroo-display
      - name: Check out klyroo-form (referenced by relative path)
        uses: actions/checkout@v4
        with:
          repository: klyroo/klyroo-form
          path: klyroo-form
      - name: Check out klyroo-query (referenced by relative path)
        uses: actions/checkout@v4
        with:
          repository: klyroo/klyroo-query
          path: klyroo-query
      - name: Check out klyroo-spreadsheet (referenced by relative path)
        uses: actions/checkout@v4
        with:
          repository: klyroo/klyroo-spreadsheet
          path: klyroo-spreadsheet
      - name: Check out klyroo-table (referenced by relative path)
        uses: actions/checkout@v4
        with:
          repository: klyroo/klyroo-table
          path: klyroo-table
      - name: Check out klyroo-ui (referenced by relative path)
        uses: actions/checkout@v4
        with:
          repository: klyroo/klyroo-ui
          path: klyroo-ui
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            10.0.x
            11.0.x
      - name: Restore
        run: dotnet restore Klyroo.Stack.slnx
      - name: Build
        run: dotnet build Klyroo.Stack.slnx -c Release --no-restore --nologo
      - name: Test
        run: dotnet test Klyroo.Stack.slnx -c Release --no-build --nologo
      - name: NativeAOT and trimming analyzers on the .Core libraries
        run: |
          # Only the libraries that declare NativeAOT compatibility: the global properties would otherwise also flow into
          # projects they reference that are not meant to be trimmed (the docs site, for example).
          for core in src/*.Core/*.csproj; do
            grep -q '<IsAotCompatible>true</IsAotCompatible>' "$core" || continue
            dotnet build "$core" -c Release -p:EnableAotAnalyzer=true -p:EnableTrimAnalyzer=true --nologo
          done
      - name: Formatting report
        # Reported, not blocking yet: the code predates .editorconfig. Remove continue-on-error after a one-time
        # `dotnet format` commit.
        continue-on-error: true
        run: dotnet format Klyroo.Stack.slnx --verify-no-changes --no-restore --include src/ tests/ site/ build/ benchmarks/
      - name: Pack
        run: dotnet pack Klyroo.Stack.slnx -c Release --no-build -o ./artifacts/nupkgs --nologo
      - name: Verify NuGet metadata
        run: |
          fail=0
          for p in ./artifacts/nupkgs/*.nupkg; do
            spec=$(unzip -p "$p" '*.nuspec')
            for tag in '<id>' '<version>' '<authors>' '<description>' '<license type="expression">MIT' '<readme>' '<projectUrl>' '<repository type="git" url="https://github.com/klyroo/' '<tags>'; do
              if ! grep -qF "$tag" <<<"$spec"; then echo "::error::$(basename "$p"): missing $tag"; fail=1; fi
            done
            if grep -qiE '\blux\b|luxstack' <<<"$spec"; then echo "::error::$(basename "$p"): old brand in metadata"; fail=1; fi
          done
          exit $fail
      - uses: actions/upload-artifact@v4
        with:
          name: nupkgs-klyroo-stack
          path: klyroo-stack/artifacts/nupkgs/*

  native-aot-template-verify:
    runs-on: ubuntu-latest
    needs: build-and-test
    defaults:
      run:
        working-directory: klyroo-stack
    steps:
      - uses: actions/checkout@v4
        with:
          path: klyroo-stack
      - name: Check out klyroo-agent (referenced by relative path)
        uses: actions/checkout@v4
        with:
          repository: klyroo/klyroo-agent
          path: klyroo-agent
      - name: Check out klyroo-dashboard (referenced by relative path)
        uses: actions/checkout@v4
        with:
          repository: klyroo/klyroo-dashboard
          path: klyroo-dashboard
      - name: Check out klyroo-display (referenced by relative path)
        uses: actions/checkout@v4
        with:
          repository: klyroo/klyroo-display
          path: klyroo-display
      - name: Check out klyroo-form (referenced by relative path)
        uses: actions/checkout@v4
        with:
          repository: klyroo/klyroo-form
          path: klyroo-form
      - name: Check out klyroo-query (referenced by relative path)
        uses: actions/checkout@v4
        with:
          repository: klyroo/klyroo-query
          path: klyroo-query
      - name: Check out klyroo-spreadsheet (referenced by relative path)
        uses: actions/checkout@v4
        with:
          repository: klyroo/klyroo-spreadsheet
          path: klyroo-spreadsheet
      - name: Check out klyroo-table (referenced by relative path)
        uses: actions/checkout@v4
        with:
          repository: klyroo/klyroo-table
          path: klyroo-table
      - name: Check out klyroo-ui (referenced by relative path)
        uses: actions/checkout@v4
        with:
          repository: klyroo/klyroo-ui
          path: klyroo-ui
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            10.0.x
            11.0.x
      - name: Pack the templates and check the Core library with the NativeAOT analyzers
        run: |
          dotnet pack templates/Klyroo.Templates/Klyroo.Templates.csproj -c Release -o ./artifacts/nupkgs --nologo
          dotnet build src/Klyroo.Stack.Core/Klyroo.Stack.Core.csproj -c Release -p:EnableAotAnalyzer=true -p:EnableTrimAnalyzer=true --nologo

  templates-from-local-feed:
    # What someone gets who has only the packages: the nine repositories are packed into a local feed, Klyroo.Templates is installed from it, and the
    # generated apps are built against that feed alone (a nuget.config maps Klyroo.* to it). build/verify-templates.sh does the work, so the same two
    # commands reproduce this job on a machine.
    runs-on: ubuntu-latest
    needs: build-and-test
    defaults:
      run:
        working-directory: klyroo-stack
    steps:
      - uses: actions/checkout@v4
        with:
          path: klyroo-stack
      - name: Check out klyroo-agent (referenced by relative path)
        uses: actions/checkout@v4
        with:
          repository: klyroo/klyroo-agent
          path: klyroo-agent
      - name: Check out klyroo-dashboard (referenced by relative path)
        uses: actions/checkout@v4
        with:
          repository: klyroo/klyroo-dashboard
          path: klyroo-dashboard
      - name: Check out klyroo-display (referenced by relative path)
        uses: actions/checkout@v4
        with:
          repository: klyroo/klyroo-display
          path: klyroo-display
      - name: Check out klyroo-form (referenced by relative path)
        uses: actions/checkout@v4
        with:
          repository: klyroo/klyroo-form
          path: klyroo-form
      - name: Check out klyroo-query (referenced by relative path)
        uses: actions/checkout@v4
        with:
          repository: klyroo/klyroo-query
          path: klyroo-query
      - name: Check out klyroo-spreadsheet (referenced by relative path)
        uses: actions/checkout@v4
        with:
          repository: klyroo/klyroo-spreadsheet
          path: klyroo-spreadsheet
      - name: Check out klyroo-table (referenced by relative path)
        uses: actions/checkout@v4
        with:
          repository: klyroo/klyroo-table
          path: klyroo-table
      - name: Check out klyroo-ui (referenced by relative path)
        uses: actions/checkout@v4
        with:
          repository: klyroo/klyroo-ui
          path: klyroo-ui
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            10.0.x
            11.0.x
      - name: Use caches of their own, so that nothing comes from a previous run
        run: |
          echo "DOTNET_CLI_HOME=$RUNNER_TEMP/dotnet-home" >> "$GITHUB_ENV"
          echo "NUGET_PACKAGES=$RUNNER_TEMP/nuget" >> "$GITHUB_ENV"
      - name: Install the NativeAOT toolchain
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev
      - name: Pack the nine repositories into a local feed
        run: build/pack-feed.sh "$RUNNER_TEMP/feed"
      - name: Generate saas, admin and headless from the feed, build them, run the web apps and publish headless with NativeAOT
        run: build/verify-templates.sh "$RUNNER_TEMP/feed" "$RUNNER_TEMP/apps"

  accessibility-wcag-audit:
    runs-on: ubuntu-latest
    needs: build-and-test
    defaults:
      run:
        working-directory: klyroo-stack
    steps:
      - uses: actions/checkout@v4
        with:
          path: klyroo-stack
      - name: Check out klyroo-agent (referenced by relative path)
        uses: actions/checkout@v4
        with:
          repository: klyroo/klyroo-agent
          path: klyroo-agent
      - name: Check out klyroo-dashboard (referenced by relative path)
        uses: actions/checkout@v4
        with:
          repository: klyroo/klyroo-dashboard
          path: klyroo-dashboard
      - name: Check out klyroo-display (referenced by relative path)
        uses: actions/checkout@v4
        with:
          repository: klyroo/klyroo-display
          path: klyroo-display
      - name: Check out klyroo-form (referenced by relative path)
        uses: actions/checkout@v4
        with:
          repository: klyroo/klyroo-form
          path: klyroo-form
      - name: Check out klyroo-query (referenced by relative path)
        uses: actions/checkout@v4
        with:
          repository: klyroo/klyroo-query
          path: klyroo-query
      - name: Check out klyroo-spreadsheet (referenced by relative path)
        uses: actions/checkout@v4
        with:
          repository: klyroo/klyroo-spreadsheet
          path: klyroo-spreadsheet
      - name: Check out klyroo-table (referenced by relative path)
        uses: actions/checkout@v4
        with:
          repository: klyroo/klyroo-table
          path: klyroo-table
      - name: Check out klyroo-ui (referenced by relative path)
        uses: actions/checkout@v4
        with:
          repository: klyroo/klyroo-ui
          path: klyroo-ui
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            10.0.x
            11.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check that the nine repositories share one version
        run: |
          cd "$GITHUB_WORKSPACE"
          expected=$(grep -oE '<Version(Prefix|Suffix)>[^<]*' klyroo-stack/build/Version.props | tr '\n' ' ')
          fail=0
          for r in agent dashboard display form query spreadsheet table ui; do
            actual=$(grep -oE '<Version(Prefix|Suffix)>[^<]*' "klyroo-$r/build/Version.props" | tr '\n' ' ')
            if [[ "$actual" != "$expected" ]]; then echo "::error::klyroo-$r has version '$actual', klyroo-stack has '$expected'"; fail=1; fi
          done
          exit $fail
      - name: Build and start the docs site
        env:
          Klyroo__Templates__Enabled: 'false'
        run: |
          dotnet build site/Klyroo.Stack.Site/Klyroo.Stack.Site.csproj -c Release --nologo
          nohup dotnet run --project site/Klyroo.Stack.Site -c Release --no-build --urls http://localhost:5180 > site.log 2>&1 &
          for i in $(seq 1 90); do curl -sf -o /dev/null http://localhost:5180/ && exit 0; sleep 2; done
          cat site.log; exit 1
      - name: WCAG 2.1 AA / axe-core audit of the showcase and docs
        run: |
          npm install --no-save playwright@1.65.1 @axe-core/playwright@4.14.1
          npx playwright install --with-deps chromium
          node build/verify-a11y.mjs
